    <body>
        <!-- Add HTML markup elements for your web site below -->
        <h2>Discover the colors that suit you</h2>
        <img src="skintone.jpeg" alt="image for skin tones.">
        <p>Enter your skin tone and discover the colors that suit you or the unsuitable ones.</p>
        <p>The grades you must choose from:</p>
        <ul>
            <select id="select">
            <option value="">--choose your skin tone--</option>
            <option class="pale" value="1">1.Pale Skin</option><br>
            <option class="light" value="2">2.Ligth Skin</option><br>
            <option class="medium" value="3">3.Light-Medium Skin</option><br>
            <option class="olive" value="4">4.Olive Skin</option><br>
            <option class="bronze" value="5">5.Bronze Skin</option><br>
            <option class="dark" value="6">6.Rich Dark Skin</option><br>
            </select>
        </ul>
        <button id="sut">Suitable colors</button><br>
        <button id="unsut">Unsuitable colors</button>
        <p id="message"></p>
        <div></div>
        <script type="text/javascript" src="script.js"></script>
    </body>
